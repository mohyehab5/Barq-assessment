name: Continuous Integration & Service Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Environment Setup
        run: |
          cp .env.example .env
          chmod +x scripts/*.sh

      - name: Docker Compose Syntax & Configuration Check
        run: docker compose config

      - name: Build and Start Stack
        run: docker compose up --build -d

      - name: Run Automated Stack Validation
        run: ./scripts/validate.sh

      - name: Run Failover & HA Recovery Test
        run: ./scripts/failure_test.sh

      - name: Test Database Backup and Restore
        run: |
          ./scripts/backup.sh
          LATEST_BACKUP=$(ls -t backups/*.sql | head -n 1)
          ./scripts/restore.sh "$LATEST_BACKUP"

      - name: Extra Credit - Security & Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Teardown Environment
        if: always()
        run: docker compose down -v
