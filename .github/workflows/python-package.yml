# ============================================================
      # 2. CREATE CI ENVIRONMENT FROM GITHUB SECRETS
      # ============================================================
      - name: Create CI Environment
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PUBLIC_PORT: ${{ secrets.PUBLIC_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          echo "POSTGRES_USER=${POSTGRES_USER}" >> .env
          echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "PUBLIC_PORT=${PUBLIC_PORT}" >> .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "REDIS_URL=${REDIS_URL}" >> .env

          echo "CI environment file (.env) created successfully from GitHub Secrets."
