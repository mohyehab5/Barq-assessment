name: Continuous Integration & Service Validation

on:
  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

  workflow_dispatch:

jobs:
  validate-stack:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: barq-academy

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VALIDATE IDENTIFIER LENGTHS & CREATE CI ENVIRONMENT
      # ============================================================
      - name: Validate Identifier Lengths & Create CI Environment
        env:
          SECRET_USER: ${{ secrets.POSTGRES_USER }}
          SECRET_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BARQ_TASKS: ${{ secrets.BARQ_TASKS }}
        run: |
          # Fallback defaults
          TARGET_USER="${SECRET_USER:-barq_app}"
          TARGET_DB="${SECRET_DB:-barq_tasks}"

          # Calculate lengths
          USER_LEN=${#TARGET_USER}
          DB_LEN=${#TARGET_DB}

          echo "==> PostgreSQL Identifier Length Check:"
          echo "POSTGRES_USER length: $USER_LEN characters"
          echo "POSTGRES_DB length:   $DB_LEN characters"

          # Fail explicitly if any identifier reaches 64 characters or more
          FAIL=0
          if [ "$USER_LEN" -ge 64 ]; then
            echo "ERROR: POSTGRES_USER ('$TARGET_USER') is $USER_LEN characters. PostgreSQL requires < 64 chars!"
            FAIL=1
          fi

          if [ "$DB_LEN" -ge 64 ]; then
            echo "ERROR: POSTGRES_DB ('$TARGET_DB') is $DB_LEN characters. PostgreSQL requires < 64 chars!"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "FAIL: Identifier length check failed. Shorten secret values in GitHub settings."
            exit 1
          fi

          echo "PASS: All PostgreSQL identifiers are under 64 characters."

          # Create .env file
          cat << EOF > .env
          POSTGRES_USER=${TARGET_USER}
          POSTGRES_DB=${TARGET_DB}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-BarqLabOnly_7qN2vK8c}
          DATABASE_URL=${DATABASE_URL:-postgresql://${TARGET_USER}:BarqLabOnly_7qN2vK8c@postgres:5432/${TARGET_DB}}
          REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
          BARQ_TASKS=${BARQ_TASKS:-barq_tasks}
          PUBLIC_PORT=8080
          EOF

          echo "CI environment created successfully."


      # ============================================================
      # 3. VALIDATE COMPOSE FILE
      # ============================================================
      - name: Docker Compose Syntax & Configuration Check
        run: |
          docker compose config --quiet

          echo "PASS: Docker Compose configuration is valid."


      # ============================================================
      # 4. BUILD & START COMPLETE STACK WITH CLEAN VOLUMES
      # ============================================================
      - name: Build and Start Stack
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --build

          echo "Waiting for PostgreSQL container to become healthy..."
          max_attempts=20
          attempt=0
          until [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' postgres 2>/dev/null)" == "healthy" ]; do
            attempt=$((attempt+1))
            if [ $attempt -ge $max_attempts ]; then
              echo "FAIL: PostgreSQL failed to reach healthy state in time."
              docker compose logs postgres
              exit 1
            fi
            echo "Waiting for PostgreSQL... (attempt $attempt/$max_attempts)"
            sleep 3
          done

          echo "PostgreSQL is healthy! Current stack status:"
          docker compose ps


      # ============================================================
      # 5. VERIFY APPLICATION CONTAINERS
      # ============================================================
      - name: Verify Application Containers
        run: |
          echo "==> app-01"
          docker inspect app-01 \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}N/A{{end}}'

          echo "==> app-02"
          docker inspect app-02 \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}N/A{{end}}'

          echo "==> PostgreSQL"
          docker inspect postgres \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}N/A{{end}}'

          echo "==> Redis"
          docker inspect redis \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}N/A{{end}}'

          echo "==> Nginx"
          docker inspect nginx \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}N/A{{end}}'


      # ============================================================
      # 6. GET ACTUAL RUNNING APP IMAGE
      # ============================================================
      - name: Detect Running Application Image
        run: |
          APP_IMAGE_ID=$(docker inspect -f '{{.Image}}' app-01)

          echo "Running app-01 image ID:"
          echo "$APP_IMAGE_ID"

          if [ -z "$APP_IMAGE_ID" ]; then
            echo "FAIL: Could not determine app-01 image."
            exit 1
          fi

          echo "APP_IMAGE_ID=$APP_IMAGE_ID" >> "$GITHUB_ENV"

          echo "PASS: Actual running image detected."


      # ============================================================
      # 7. VERIFY IMAGE EXISTS
      # ============================================================
      - name: Verify Application Image
        run: |
          echo "Checking image:"
          echo "$APP_IMAGE_ID"

          docker image inspect "$APP_IMAGE_ID"

          echo "==> Docker images"
          docker images

          echo "PASS: Running application image exists."


      # ============================================================
      # 8. APPLICATION VALIDATION
      # ============================================================
      - name: Run Automated Stack Validation
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh


      # ============================================================
      # 9. FAILOVER & HIGH AVAILABILITY TEST
      # ============================================================
      - name: Run Failover & HA Recovery Test
        run: |
          chmod +x scripts/failure_test.py
          python3 scripts/failure_test.py


      # ============================================================
      # 10. DATABASE BACKUP & RESTORE
      # ============================================================
      - name: Test Database Backup and Restore
        run: |
          chmod +x scripts/backup.sh scripts/restore.sh

          echo "==> Creating PostgreSQL backup..."
          ./scripts/backup.sh

          BACKUP_FILE=$(ls -t ./backups/postgres_backup_*.sql 2>/dev/null | head -n 1 || true)

          if [ -z "$BACKUP_FILE" ]; then
            echo "FAIL: No PostgreSQL backup file found."
            exit 1
          fi

          if [ ! -f "$BACKUP_FILE" ]; then
            echo "FAIL: Backup file does not exist:"
            echo "$BACKUP_FILE"
            exit 1
          fi

          echo "PASS: Backup found:"
          echo "$BACKUP_FILE"

          du -h "$BACKUP_FILE"

          echo "==> Restoring PostgreSQL backup..."
          ./scripts/restore.sh "$BACKUP_FILE"

          echo "PASS: PostgreSQL backup and restore completed successfully."


      # ============================================================
      # 11. TRIVY SECURITY SCAN
      # ============================================================
      - name: Security Scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.APP_IMAGE_ID }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'


      # ============================================================
      # 12. SHOW FINAL STACK STATUS
      # ============================================================
      - name: Final Stack Status
        if: always()
        run: |
          echo "======================================"
          echo "FINAL DOCKER COMPOSE STATUS"
          echo "======================================"

          docker compose ps

          echo ""
          echo "======================================"
          echo "RUNNING CONTAINERS"
          echo "======================================"

          docker ps --format \
            "table {{.Names}}\t{{.Image}}\t{{.Status}}"


      # ============================================================
      # 13. COLLECT LOGS IF ANY TEST FAILS
      # ============================================================
      - name: Collect Container Logs on Failure
        if: failure()
        run: |
          echo "======================================"
          echo "DOCKER COMPOSE LOGS"
          echo "======================================"

          docker compose logs --no-color || true

          echo ""
          echo "======================================"
          echo "POSTGRES LOGS"
          echo "======================================"

          docker compose logs --no-color postgres --tail=100 || true

          echo ""
          echo "======================================"
          echo "APP-01 LOGS"
          echo "======================================"

          docker compose logs --no-color app-01 --tail=100 || true


      # ============================================================
      # 14. TEARDOWN
      # ============================================================
      - name: Teardown Environment
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
