name: Continuous Integration & Service Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate-stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barq-academy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Environment Setup
        run: |
          cat << 'EOF' > .env
          POSTGRES_USER=barq_app
          POSTGRES_DB=barq_tasks
          POSTGRES_PASSWORD=BarqLabOnly_7qN2vK8c
          PUBLIC_PORT=8080
          DATABASE_URL=postgresql://barq_app:BarqLabOnly_7qN2vK8c@postgres:5432/barq_tasks
          EOF

      - name: Docker Compose Syntax & Configuration Check
        run: |
          docker compose config --quiet

      - name: Build and Start Stack
        run: |
          docker compose up -d --build

      - name: Run Automated Stack Validation
        run: |
          chmod +x validate.sh
          ./validate.sh

      - name: Run Failover & HA Recovery Test
        run: |
          chmod +x failure_test.sh
          ./failure_test.sh

      - name: Test Database Backup and Restore
        run: |
          chmod +x backup.sh restore.sh
          ./backup.sh
          ./restore.sh

      - name: Extra Credit - Security & Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'barq-api:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Collect Container Logs on Failure
        if: failure()
        run: |
          docker compose logs || true

      - name: Teardown Environment
        if: always()
        run: |
          docker compose down -v || true
