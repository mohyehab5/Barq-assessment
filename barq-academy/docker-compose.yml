name: barq-assessment

x-app: &app
  build: .
  init: true
  restart: unless-stopped
  environment:
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    POSTGRES_HOST: "postgres"
    REDIS_HOST: "redis"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 256M
      reservations:
        cpus: '0.10'
        memory: 64M
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s
  networks:
    - lab-frontend
    - lab-backend

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - lab-backend

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - lab-backend

  app-01:
    <<: *app
    container_name: app-01
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8090"
      INSTANCE_ID: "app-01"
      POSTGRES_HOST: "postgres"
      REDIS_HOST: "redis"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  app-02:
    <<: *app
    container_name: app-02
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8090"
      INSTANCE_ID: "app-02"
      POSTGRES_HOST: "postgres"
      REDIS_HOST: "redis"
